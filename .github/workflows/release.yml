# Tags main and publishes a GitHub release whenever a merged pull request
# warrants one. .github/scripts/next-version.sh decides the version from the
# pull request titles; a merge that is only docs, chore, ci or test releases
# nothing.
#
# authkit is a library, so the tag is the release: apps fetch it with
# `go get github.com/relloyd/authkit@vX.Y.Z`. There are no binaries to build
# and nothing is uploaded, so a release uses none of the account's Actions
# artifact storage. The GitHub release exists for its notes, which list the
# pull requests merged since the previous tag.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto releases only if a pull request warrants it)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

env:
  # Test with the latest patch release, as the PR checks do.
  GO_VERSION: "1.27.x"
  # When bumping, update the checksum from task_checksums.txt (task_linux_amd64.tar.gz)
  # on the matching release at https://github.com/go-task/task/releases.
  TASK_VERSION: "3.54.0"
  TASK_CHECKSUM: "680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb"

# Two merges in quick succession must not both pick the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is worked out from the tags and the history since.
          fetch-depth: 0

      - id: version
        name: Work out the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag=$(.github/scripts/next-version.sh "$BUMP")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Releasing $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No feat, fix or perf pull request since the last tag; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.version.outputs.tag != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Don't settle for an older 1.27 patch cached on the runner image.
          check-latest: true

      - if: steps.version.outputs.tag != ''
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_CHECKSUM }}

      - if: steps.version.outputs.tag != ''
        name: gofmt, go vet, go mod tidy, govulncheck, tests (-race)
        run: task ci

      - if: steps.version.outputs.tag != ''
        name: Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      # A rerun of a release that failed part way finds the release already
      # there and leaves it alone.
      - if: steps.version.outputs.tag != ''
        name: Publish the GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      # Asking the Go module proxy for the new version makes it fetch and cache
      # the tag now, so the first app to `go get` it (and pkg.go.dev) need not
      # wait. Best effort: the tag and release already stand if this fails.
      - if: steps.version.outputs.tag != ''
        name: Announce the version to the Go module proxy
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP"
          GOPROXY=https://proxy.golang.org go list -m "github.com/relloyd/authkit@$TAG" ||
            echo "::warning::proxy.golang.org has not picked up $TAG yet; it will on first use."
